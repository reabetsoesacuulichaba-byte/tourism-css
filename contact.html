<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Discover Lesotho, the Kingdom in the Sky. Explore beautiful destinations, accommodation and exciting activities.">

    <title>Discover Lesotho | Tourism Website</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark d-3">
            <a href="home.html">home</a>|
            <a href="destination.html">destination</a>|
            <a href="services.html">services</a>|
            <a href="gallery.html">gallery</a>|
            <a href="contact.html">contact</a>|
        </nav>
        <section id="booking" class="booking-section py-5">

            <div class="container">

                <div class="text-center mb-4">

                    <h2 class="section-title">Plan Your Visit</h2>

                    <p>Send us your travel details and booking enquiry.</p>

                </div>

                <div class="row justify-content-center">

                    <div class="col-lg-8">

                        <div class="booking-card">

                            <form id="bookingForm">

                                <div class="row g-3">

                                    <div class="col-md-6">

                                        <label for="fullname" class="form-label">
                                            Full Name
                                        </label>

                                        <input type="text" id="fullname"
                                            class="form-control"
                                            placeholder="Enter your name" required>

                                    </div>


                                    <div class="col-md-6">

                                        <label for="email" class="form-label">
                                            Email Address
                                        </label>

                                        <input type="email" id="email"
                                            class="form-control"
                                            placeholder="Enter your email" required>

                                    </div>


                                    <div class="col-md-6">

                                        <label for="destination" class="form-label">
                                            Destination
                                        </label>

                                        <select id="destination" class="form-select"
                                            required>

                                            <option value="">Choose Destination</option>

                                            <option>Maletsunyane Falls</option>

                                            <option>Katse Dam</option>

                                            <option>Sani Pass</option>

                                        </select>

                                    </div>


                                    <div class="col-md-6">

                                        <label for="date" class="form-label">
                                            Travel Date
                                        </label>

                                        <input type="date" id="date"
                                            class="form-control" required>

                                    </div>


                                    <div class="col-12">


                                    <div class="col-12">

                                        <button type="submit"
                                            class="btn btn-success w-100">

                                            Submit Booking Enquiry

                                        </button>

                                    </div>

                                </div>

                            </form>

                            <div id="formMessage" class="mt-3"></div>

                        </div>

                    </div>

                </div>

            </div>

        

        <footer class="footer text-center">

        <div class="container">

            <h4>DISCOVER LESOTHO</h4>

            <p>Explore the Kingdom in the Sky.</p>

            
            <p>
            2026 Discover Lesotho Tourism.
            </p>

        </div>

    </footer>


    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    
    <script src="script.js"></script>

</body>
</html>
